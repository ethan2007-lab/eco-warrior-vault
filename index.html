<!DOCTYPE html>
<html>
<head>
  <title>🌿 Eco Media Vault</title>

  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(-45deg, #56ab2f, #a8e063, #00c6ff, #0072ff);
      background-size: 400% 400%;
      animation: gradient 10s ease infinite;
      color: white;
      text-align: center;
    }

    @keyframes gradient {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    h1 {
      margin-top: 20px;
      font-size: 2.5rem;
    }

    .upload-box {
      margin: 20px;
    }

    input[type="file"] {
      padding: 10px;
      border-radius: 10px;
      border: none;
    }

    button {
      padding: 10px 20px;
      margin-left: 10px;
      border: none;
      border-radius: 10px;
      background: #00000080;
      color: white;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background: black;
    }

    #gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
      padding: 20px;
    }

    .card {
      background: rgba(255,255,255,0.1);
      backdrop-filter: blur(10px);
      border-radius: 15px;
      padding: 10px;
      transition: transform 0.3s;
    }

    .card:hover {
      transform: scale(1.05);
    }

    img, video {
      width: 100%;
      border-radius: 10px;
    }
  </style>
</head>

<body>

<h1>🌿 Eco Media Vault</h1>

<div class="upload-box">
  <input type="file" id="fileInput">
  <button onclick="uploadFile()">Upload</button>
</div>

<div id="gallery"></div>

<script>
async function uploadFile() {
  const file = document.getElementById('fileInput').files[0];

  const formData = new FormData();
  formData.append('file', file);
  formData.append('upload_preset', 'eco_upload');

  const res = await fetch('https://api.cloudinary.com/v1_1/dtrpwaeyt/upload', {
    method: 'POST',
    body: formData
  });

  const data = await res.json();
  displayMedia(data.secure_url);
}

function displayMedia(url) {
  const gallery = document.getElementById('gallery');

  const card = document.createElement("div");
  card.className = "card";

  if (url.includes("video")) {
    const vid = document.createElement("video");
    vid.src = url;
    vid.controls = true;
    card.appendChild(vid);
  } else {
    const img = document.createElement("img");
    img.src = url;
    card.appendChild(img);
  }

  gallery.appendChild(card);
}
</script>

</body>
</html>
