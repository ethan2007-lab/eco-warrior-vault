<!DOCTYPE html>
<html>
<head>
  <title>🌿 Eco Warrior Vault</title>

  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: #0f2027;
      color: white;
    }

    .center {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      flex-direction: column;
    }

    input {
      padding: 10px;
      margin: 5px;
      border-radius: 10px;
      border: none;
    }

    button {
      padding: 10px 20px;
      border-radius: 10px;
      border: none;
      background: #56ab2f;
      color: white;
      cursor: pointer;
    }

    .hidden {
      display: none;
    }

    .navbar {
      text-align: center;
      padding: 15px;
      font-size: 1.5rem;
      background: rgba(255,255,255,0.1);
    }

    #gallery {
      max-width: 500px;
      margin: auto;
    }

    .card {
      background: rgba(255,255,255,0.05);
      margin: 15px;
      padding: 10px;
      border-radius: 15px;
    }

    img, video {
      width: 100%;
      border-radius: 10px;
    }

    .actions {
      display: flex;
      justify-content: space-between;
      margin-top: 10px;
    }
  </style>
</head>

<body>

<!-- LOGIN PAGE -->
<div id="loginPage" class="center">
  <h2>🔐 Eco Warrior Vault Login</h2>
  <input type="text" id="username" placeholder="Username">
  <input type="password" id="password" placeholder="Password">
  <button onclick="login()">Login</button>
  <p id="error" style="color:red;"></p>
</div>

<!-- MAIN APP -->
<div id="app" class="hidden">

  <div class="navbar">🌿 Eco Warrior Vault</div>

  <div class="center" style="height:auto;">
    <input type="file" id="fileInput">
    <button onclick="uploadFile()">Upload</button>
  </div>

  <div id="gallery"></div>

</div>

<script>
const correctUser = "ecowarrior";
const correctPass = "student123";

function login() {
  const user = document.getElementById("username").value;
  const pass = document.getElementById("password").value;

  if (user === correctUser && pass === correctPass) {
    document.getElementById("loginPage").style.display = "none";
    document.getElementById("app").classList.remove("hidden");
  } else {
    document.getElementById("error").innerText = "Wrong username or password";
  }
}

let posts = JSON.parse(localStorage.getItem("posts")) || [];

function savePosts() {
  localStorage.setItem("posts", JSON.stringify(posts));
}

async function uploadFile() {
  const file = document.getElementById('fileInput').files[0];

  const formData = new FormData();
  formData.append('file', file);
  formData.append('upload_preset', 'eco_upload');

  const res = await fetch('https://api.cloudinary.com/v1_1/dtrpwaeyt/upload', {
    method: 'POST',
    body: formData
  });

  const data = await res.json();

  posts.unshift({ url: data.secure_url, likes: 0 });
  savePosts();
  renderPosts();
}

function renderPosts() {
  const gallery = document.getElementById('gallery');
  gallery.innerHTML = "";

  posts.forEach((post, index) => {
    const card = document.createElement("div");
    card.className = "card";

    let media;
    if (post.url.includes("video")) {
      media = document.createElement("video");
      media.controls = true;
    } else {
      media = document.createElement("img");
    }

    media.src = post.url;
    card.appendChild(media);

    const actions = document.createElement("div");
    actions.className = "actions";

    const like = document.createElement("span");
    like.innerHTML = "❤️ " + post.likes;

    like.onclick = () => {
      post.likes++;
      savePosts();
      renderPosts();
    };

    const del = document.createElement("span");
    del.innerHTML = "🗑";

    del.onclick = () => {
      posts.splice(index, 1);
      savePosts();
      renderPosts();
    };

    actions.appendChild(like);
    actions.appendChild(del);

    card.appendChild(actions);
    gallery.appendChild(card);
  });
}

renderPosts();
</script>

</body>
</html>
