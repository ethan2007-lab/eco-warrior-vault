<!DOCTYPE html>
<html>
<head>
  <title>🌿 Eco Warriour Vault</title>

  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      overflow-x: hidden;
      color: white;
    }

    h1 {
      text-align: center;
      margin-top: 20px;
      font-size: 2.5rem;
    }

    .upload-box {
      text-align: center;
      margin: 20px;
    }

    input {
      padding: 10px;
      border-radius: 10px;
      border: none;
    }

    button {
      padding: 10px 20px;
      margin-left: 10px;
      border-radius: 10px;
      border: none;
      background: rgba(255,255,255,0.2);
      color: white;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background: rgba(255,255,255,0.4);
    }

    #gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      padding: 20px;
    }

    .card {
      background: rgba(255,255,255,0.1);
      backdrop-filter: blur(15px);
      border-radius: 15px;
      padding: 10px;
      transition: transform 0.3s;
    }

    .card:hover {
      transform: scale(1.05);
    }

    img, video {
      width: 100%;
      border-radius: 10px;
    }

    /* Floating particles */
    .leaf {
      position: fixed;
      width: 10px;
      height: 10px;
      background: #a8e063;
      border-radius: 50%;
      opacity: 0.5;
      animation: float 10s linear infinite;
    }

    @keyframes float {
      from { transform: translateY(100vh) }
      to { transform: translateY(-10vh) }
    }
  </style>
</head>

<body>

<h1>🌿 Eco Warriour Vault</h1>

<div class="upload-box">
  <input type="file" id="fileInput">
  <button onclick="uploadFile()">Upload</button>
</div>

<div id="gallery"></div>

<script>
async function uploadFile() {
  const file = document.getElementById('fileInput').files[0];

  const formData = new FormData();
  formData.append('file', file);
  formData.append('upload_preset', 'eco_upload');

  const res = await fetch('https://api.cloudinary.com/v1_1/dtrpwaeyt/upload', {
    method: 'POST',
    body: formData
  });

  const data = await res.json();
  displayMedia(data.secure_url);
}

function displayMedia(url) {
  const gallery = document.getElementById('gallery');

  const card = document.createElement("div");
  card.className = "card";

  if (url.includes("video")) {
    const vid = document.createElement("video");
    vid.src = url;
    vid.controls = true;
    card.appendChild(vid);
  } else {
    const img = document.createElement("img");
    img.src = url;
    card.appendChild(img);
  }

  gallery.appendChild(card);
}

/* Create floating particles */
for (let i = 0; i < 20; i++) {
  let leaf = document.createElement("div");
  leaf.className = "leaf";
  leaf.style.left = Math.random() * 100 + "vw";
  leaf.style.animationDuration = (5 + Math.random() * 10) + "s";
  document.body.appendChild(leaf);
}
</script>

</body>
</html>
