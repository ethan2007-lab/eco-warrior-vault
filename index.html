<!DOCTYPE html>
<html>
<head>
  <title>🌿 Eco Warrior Vault</title>

  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(to right, #134e5e, #71b280);
      color: white;
    }

    .center {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      flex-direction: column;
    }

    input {
      padding: 10px;
      margin: 5px;
      border-radius: 10px;
      border: none;
    }

    button {
      padding: 10px 20px;
      border-radius: 10px;
      border: none;
      background: #2ecc71;
      color: white;
      cursor: pointer;
    }

    .hidden {
      display: none;
    }

    .navbar {
      text-align: center;
      padding: 15px;
      font-size: 1.5rem;
      background: rgba(0,0,0,0.2);
    }

    #gallery {
      max-width: 500px;
      margin: auto;
    }

    .card {
      background: rgba(255,255,255,0.1);
      margin: 15px;
      padding: 10px;
      border-radius: 15px;
    }

    img, video {
      width: 100%;
      border-radius: 10px;
    }

    .actions {
      display: flex;
      justify-content: space-between;
      margin-top: 10px;
    }
  </style>
</head>

<body>

<!-- LOGIN -->
<div id="loginPage" class="center">
  <h2>🔐 Eco Warrior Vault</h2>
  <input id="username" placeholder="Username">
  <input id="password" type="password" placeholder="Password">
  <button onclick="login()">Login</button>
  <p id="error" style="color:red;"></p>
</div>

<!-- APP -->
<div id="app" class="hidden">

  <div class="navbar">🌿 Eco Warrior Vault</div>

  <div class="center" style="height:auto;">
    <input type="file" id="fileInput">
    <button onclick="uploadFile()">Upload</button>
  </div>

  <div id="gallery"></div>

</div>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyDqhcc6RcRi5IXwLt-MyrdtKWtTKKT5aRKGA",
  authDomain: "eco-warrior-vault-49fc3.firebaseapp.com",
  projectId: "eco-warrior-vault-49fc3",
  storageBucket: "eco-warrior-vault-49fc3.appspot.com",
  messagingSenderId: "192648443627",
  appId: "1:192648443627:web:42364414912a003cb3b0ae"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

const correctUser = "ecowarrior";
const correctPass = "student123";

function login() {
  const user = document.getElementById("username").value;
  const pass = document.getElementById("password").value;

  if (user === correctUser && pass === correctPass) {
    document.getElementById("loginPage").style.display = "none";
    document.getElementById("app").classList.remove("hidden");
    loadPosts();
  } else {
    document.getElementById("error").innerText = "Wrong username or password";
  }
}

async function uploadFile() {
  const file = document.getElementById('fileInput').files[0];

  if (!file) {
    alert("Select a file first");
    return;
  }

  const formData = new FormData();
  formData.append('file', file);
  formData.append('upload_preset', 'eco_upload');

  const res = await fetch('https://api.cloudinary.com/v1_1/dtrpwaeyt/upload', {
    method: 'POST',
    body: formData
  });

  const data = await res.json();

  await db.collection("posts").add({
    url: data.secure_url,
    likes: 0,
    time: Date.now()
  });

  loadPosts();
}

async function loadPosts() {
  const gallery = document.getElementById('gallery');
  gallery.innerHTML = "";

  const snapshot = await db.collection("posts").orderBy("time", "desc").get();

  snapshot.forEach(doc => {
    const post = doc.data();

    const card = document.createElement("div");
    card.className = "card";

    let media;
    if (post.url.includes("video")) {
      media = document.createElement("video");
      media.controls = true;
    } else {
      media = document.createElement("img");
    }

    media.src = post.url;
    card.appendChild(media);

    const actions = document.createElement("div");
    actions.className = "actions";

    const like = document.createElement("span");
    like.innerHTML = "❤️ " + post.likes;

    like.onclick = async () => {
      await db.collection("posts").doc(doc.id).update({
        likes: post.likes + 1
      });
      loadPosts();
    };

    const del = document.createElement("span");
    del.innerHTML = "🗑";

    del.onclick = async () => {
      await db.collection("posts").doc(doc.id).delete();
      loadPosts();
    };

    actions.appendChild(like);
    actions.appendChild(del);

    card.appendChild(actions);
    gallery.appendChild(card);
  });
}
</script>

</body>
</html>
