<!DOCTYPE html>
<html>
<head>
  <title>🌿 Eco Warrior Vault</title>

  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #0f2027, #203a43);
      color: white;
    }

    .navbar {
      position: sticky;
      top: 0;
      backdrop-filter: blur(15px);
      background: rgba(255,255,255,0.08);
      padding: 15px;
      text-align: center;
      font-size: 1.4rem;
      font-weight: bold;
    }

    .center {
      text-align: center;
      padding: 20px;
    }

    .upload-btn {
      background: linear-gradient(45deg, #56ab2f, #a8e063);
      padding: 12px 25px;
      border-radius: 30px;
      cursor: pointer;
      font-weight: bold;
    }

    input[type="file"] { display: none; }

    #gallery {
      max-width: 500px;
      margin: auto;
    }

    .card {
      background: rgba(255,255,255,0.07);
      margin: 20px;
      padding: 12px;
      border-radius: 15px;
      backdrop-filter: blur(10px);
      animation: fadeIn 0.4s ease;
    }

    img, video {
      width: 100%;
      border-radius: 10px;
    }

    .actions {
      display: flex;
      justify-content: space-between;
      margin-top: 10px;
      font-size: 1.2rem;
    }

    .like {
      cursor: pointer;
      transition: transform 0.2s;
    }

    .like:active {
      transform: scale(1.5);
    }

    .delete {
      cursor: pointer;
      opacity: 0.6;
    }

    .comments {
      margin-top: 10px;
      font-size: 0.9rem;
    }

    .comment-input {
      width: 80%;
      padding: 5px;
      border-radius: 8px;
      border: none;
      margin-top: 5px;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px);}
      to { opacity: 1; transform: translateY(0);}
    }

    .hidden { display: none; }
  </style>
</head>

<body>

<!-- LOGIN -->
<div id="loginPage" class="center">
  <h2>🔐 Eco Warrior Vault</h2>
  <input id="username" placeholder="Username"><br><br>
  <input id="password" type="password" placeholder="Password"><br><br>
  <button onclick="login()">Login</button>
  <p id="error" style="color:red;"></p>
</div>

<!-- APP -->
<div id="app" class="hidden">

  <div class="navbar">🌿 Eco Warrior Vault</div>

  <div class="center">
    <label class="upload-btn">
      📤 Upload Media
      <input type="file" id="fileInput" onchange="uploadFile()">
    </label>
  </div>

  <div id="gallery"></div>

</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyDqhcc6RcRi5IXwLt-MyrdtKWtTKKT5aRKGA",
  authDomain: "eco-warrior-vault-49fc3.firebaseapp.com",
  projectId: "eco-warrior-vault-49fc3"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

function login() {
  if (username.value === "ecowarrior" && password.value === "student123") {
    loginPage.style.display = "none";
    app.classList.remove("hidden");
    loadPosts();
  } else {
    error.innerText = "Wrong credentials";
  }
}

async function uploadFile() {
  const file = fileInput.files[0];
  if (!file) return;

  const formData = new FormData();
  formData.append('file', file);
  formData.append('upload_preset', 'eco_upload');

  const res = await fetch('https://api.cloudinary.com/v1_1/dtrpwaeyt/auto/upload', {
    method: 'POST',
    body: formData
  });

  const data = await res.json();

  await db.collection("posts").add({
    url: data.secure_url,
    likes: 0,
    comments: [],
    time: Date.now()
  });

  loadPosts();
}

async function loadPosts() {
  gallery.innerHTML = "";

  const snapshot = await db.collection("posts").orderBy("time","desc").get();

  snapshot.forEach(doc => {
    const post = doc.data();

    const card = document.createElement("div");
    card.className = "card";

    let media = post.url.includes("video") ? document.createElement("video") : document.createElement("img");
    if (post.url.includes("video")) media.controls = true;

    media.src = post.url;
    card.appendChild(media);

    const actions = document.createElement("div");
    actions.className = "actions";

    const like = document.createElement("span");
    like.className = "like";
    like.innerHTML = "❤️ " + post.likes;

    like.onclick = async () => {
      await db.collection("posts").doc(doc.id).update({
        likes: post.likes + 1
      });
      loadPosts();
    };

    const del = document.createElement("span");
    del.className = "delete";
    del.innerHTML = "🗑";

    del.onclick = async () => {
      await db.collection("posts").doc(doc.id).delete();
      loadPosts();
    };

    actions.appendChild(like);
    actions.appendChild(del);

    card.appendChild(actions);

    // COMMENTS
    const commentsDiv = document.createElement("div");
    commentsDiv.className = "comments";

    (post.comments || []).forEach(c => {
      const p = document.createElement("div");
      p.innerText = "💬 " + c;
      commentsDiv.appendChild(p);
    });

    const input = document.createElement("input");
    input.placeholder = "Add comment...";
    input.className = "comment-input";

    input.onkeypress = async (e) => {
      if (e.key === "Enter" && input.value.trim() !== "") {
        const newComments = [...(post.comments || []), input.value];

        await db.collection("posts").doc(doc.id).update({
          comments: newComments
        });

        loadPosts();
      }
    };

    card.appendChild(commentsDiv);
    card.appendChild(input);

    gallery.appendChild(card);
  });
}
</script>

</body>
</html>
